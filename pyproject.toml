[project]
name = "bgchange"
version = "0.1.0"
description = "Replace the background of a person/product photo with a solid colour, optionally keeping the subject's shadow."
readme = "README.md"
# Pinned to 3.12: PyTorch CUDA wheels are reliably available for it.
requires-python = ">=3.12,<3.13"
dependencies = [
    # Blackwell GPUs (RTX 50xx, sm_120) need PyTorch >= 2.7 built for CUDA >= 12.8.
    "torch>=2.7",
    # BiRefNet uses torchvision.ops.deform_conv2d.
    "torchvision>=0.22",
    # Loads BiRefNet from the Hugging Face Hub (AutoModelForImageSegmentation).
    "transformers>=4.45",
    # Imported by BiRefNet's model code on the Hub.
    "timm>=1.0",
    "kornia>=0.7",
    "einops>=0.8",
    "pillow>=10.0",
    "numpy>=1.26",
    # Imported at the top of BEN2's model code (models/ben2/BEN2.py).
    "opencv-python-headless>=4.10",
    # InSPyReNet's network code. Its own dependencies are removed below.
    "transparent-background==1.3.4",
    # The optional web API (bgchange/api/): the framework, the server that runs
    # it, and the reader for file uploads.
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-multipart>=0.0.12",
]

# The `bgchange` command: `uv run bgchange photo.jpg --color "#FF0066"` runs
# main() in bgchange/cli.py. `uv run bgchange-api` starts the optional web API.
[project.scripts]
bgchange = "bgchange.cli:main"
bgchange-api = "bgchange.api.server:main"

[dependency-groups]
dev = [
    # Used by FastAPI's TestClient in tests/api/.
    "httpx>=0.27",
    "pyarrow>=15",
    "pytest>=8.0",
]

# Take torch/torchvision from PyTorch's CUDA 12.8 index instead of PyPI.
# (PyPI's Windows wheels are CPU-only.) The Docker CPU image overrides this later.
[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]

# transparent-background normally pulls in 24 packages: a second OpenCV (the GUI
# build, which clashes with opencv-python-headless), training tools
# (albumentations, numba) and downloaders (gdown, wget). We only use its network
# code, which needs torch and timm (already above), and we download the weights
# ourselves with an MD5 check. Declaring its dependencies as empty here makes
# `uv sync` install the package alone, the same way on every machine.
[[tool.uv.dependency-metadata]]
name = "transparent-background"
version = "1.3.4"
requires-dist = []

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
